[build]
builder = "nixpacks"
# CRITICAL: We install CPU-only PyTorch first to save ~2GB download and prevent build timeouts.
# Then we install the rest of requirements (which will see torch is satisfied)
# Finally we download the depth model weights
buildCommand = "cd backend && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt && python download_models.py"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/docs"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
numReplicas = 1

[service]
name = "flux-depth-backend"
