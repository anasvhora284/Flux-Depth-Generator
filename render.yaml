services:
  # Backend Service
  - type: web
    name: flux-depth-backend
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: flux-depth-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 8000
    autoDeploy: false

  # Frontend Service
  - type: web
    name: flux-depth-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: flux-depth-backend
          property: url
    autoDeploy: false

databases:
  - name: flux-depth-db
    databaseName: flux_depth_db
    user: flux_user
    plan: free # Free tier postgres
    region: singapore
