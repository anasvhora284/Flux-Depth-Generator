services:
  # Backend Service
  - type: web
    name: flux-depth-backend
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python download_models.py
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: flux-depth-db
          property: connectionString
      # Security - Set in Render Dashboard
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "11520"
      # Email Config - Set in Render Dashboard
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SERVER
        value: "smtp.gmail.com"
      - key: MAIL_FROM_NAME
        value: "Flux Depth Generator"
    autoDeploy: false

  # Frontend Service
  - type: web
    name: flux-depth-frontend
    env: node
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      # Set to your backend URL in Render Dashboard: https://flux-depth-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_URL
        sync: false
    autoDeploy: false

databases:
  - name: flux-depth-db
    databaseName: flux_depth_db
    user: flux_user
    plan: free
    region: singapore

